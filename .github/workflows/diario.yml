name: Atualizar SIDRA Bahia 1618

on:
  schedule:
    - cron: '0 12 * * *' # 12:00 UTC = 09:00 no fuso de Salvador/Brasília (UTC-3)
  workflow_dispatch: # Permite executar manualmente quando quiseres

jobs:
  executar-sidra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Executar script SIDRA
        run: python SIDRA_1618_1.2.py

      - name: Guardar planilha como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: planilha-sidra-bahia-1618
          path: SIDRA_bahia_1618.xlsx
